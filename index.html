<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>iPortal</title>
<meta name="description" content="iPortal — tu lanzadera personal de enlaces" />
<meta name="theme-color" content="#07080c" />
<link rel="icon" type="image/x-icon" href="favicon2.ico" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://www.google.com" />
<link rel="preconnect" href="https://api.jsonbin.io" />
</head>
<body style="margin:0;">
<div id="app"></div>
<style>
  :root{
    --bg:#07080c;
    --panel:#111319;
    --panel-hover:#161923;
    --line:#22242e;
    --text:#e9eaf2;
    --muted:#7d8194;
    --blue:#4d7cff;
    --cyan:#5eead4;
    --amber:#f5b942;
    --danger:#ef5757;
    --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --text-scale:1;
  }
  *{box-sizing:border-box;}
  #app{
    min-height:100vh;
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(77,124,255,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(94,234,212,0.07), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    padding:0 0 60px 0;
  }
  #app.theme-light{ background: var(--bg); }
  a{color:inherit;text-decoration:none;}

  /* ---- Header wrap (topbar + quick nav), sticky as one unit ---- */
  .header-wrap{
    position:sticky; top:0; z-index:30;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar{
    display:flex; align-items:center; gap:16px;
    padding:16px 24px 10px;
    flex-wrap:wrap;
  }
  .cat-nav{
    display:flex; gap:8px;
    overflow-x:auto;
    padding:0 24px 12px;
    scrollbar-width:thin;
  }
  .cat-nav::-webkit-scrollbar{height:5px;}
  .cat-nav::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}
  .cat-nav-pill{
    display:flex; align-items:center; gap:6px;
    flex-shrink:0;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--muted);
    border-radius:20px;
    padding:6px 12px;
    font-size:calc(11px * var(--text-scale));
    font-family:var(--mono);
    letter-spacing:0.04em;
    text-transform:uppercase;
    cursor:pointer;
    white-space:nowrap;
    transition:color .15s, border-color .15s;
  }
  .cat-nav-pill:hover{color:var(--text); border-color:var(--muted);}
  .cat-nav-pill{cursor:grab;}
  .cat-nav-pill.dragging{opacity:0.35;}
  .cat-nav-pill.nav-drag-over-left{box-shadow:inset 3px 0 0 0 var(--cyan);}
  .cat-nav-pill.nav-drag-over-right{box-shadow:inset -3px 0 0 0 var(--cyan);}
  .cat-nav-dot{width:6px; height:6px; border-radius:50%; flex-shrink:0;}

  .fav-bar-wrap{display:flex; align-items:flex-start; gap:8px; padding:0 24px 10px;}
  .fav-toggle{
    flex-shrink:0;
    display:flex; align-items:center; gap:4px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--amber);
    border-radius:20px;
    padding:5px 10px;
    font-size:calc(11px * var(--text-scale));
    cursor:pointer;
  }
  .fav-toggle:hover{border-color:var(--amber);}
  .fav-toggle .cat-count{margin-left:2px;}
  .fav-bar{display:flex; flex-wrap:wrap; gap:5px; flex:1; min-width:0;}
  .brand{
    font-family:var(--mono);
    font-size:calc(20px * var(--text-scale)); font-weight:700; letter-spacing:0.02em;
    white-space:nowrap;
  }
  .brand .i{color:var(--blue);}
  .brand .portal{color:var(--cyan);}
  .brand small{
    display:block; font-family:var(--sans); font-weight:400;
    font-size:10px; letter-spacing:0.18em; color:var(--muted);
    margin-top:-2px;
  }
  .search-wrap{
    flex:1; min-width:180px; max-width:420px;
    position:relative;
  }
  .search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:0.5;}
  .search-wrap input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:9px 12px 9px 34px;
    font-size:calc(13px * var(--text-scale));
    font-family:var(--sans);
    outline:none;
    transition:border-color .15s;
  }
  .search-wrap input:focus{border-color:var(--blue);}
  .topbar-actions{display:flex; gap:8px; margin-left:auto;}
  .btn{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--blue);
    color:#0a0c12;
    border:none;
    border-radius:8px;
    padding:9px 14px;
    font-size:13px;
    font-weight:600;
    font-family:var(--sans);
    cursor:pointer;
    transition:filter .15s, transform .1s;
  }
  .btn:hover{filter:brightness(1.12);}
  .btn:active{transform:scale(0.97);}
  .btn.ghost{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--line);
    position:relative;
  }
  .btn.ghost:hover{color:var(--text); border-color:var(--muted);}
  .trash-count{
    position:absolute; top:-6px; right:-6px;
    background:var(--danger); color:#fff;
    font-family:var(--sans); font-size:10px; font-weight:700;
    border-radius:9px; min-width:16px; height:16px;
    display:flex; align-items:center; justify-content:center;
    padding:0 4px; line-height:1;
  }
  .status{
    font-family:var(--mono);
    font-size:10px;
    color:var(--muted);
    letter-spacing:0.05em;
    display:flex; align-items:center; gap:6px;
  }
  .status .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);}
  .status .dot.saving{background:var(--amber);}
  .status .dot.error{background:var(--danger);}

  /* ---- Grid ---- */
  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    align-items:start;
    gap:18px;
    padding:22px 24px;
    max-width:1200px;
    margin:0 auto;
  }
  @media (max-width:760px){
    .grid{grid-template-columns:1fr;}
  }
  .card{
    background:var(--panel);
    background-size:cover;
    background-position:center;
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 12px 8px;
    display:flex; flex-direction:column;
    min-width:0;
    scroll-margin-top:118px;
  }
  .card.dragging{opacity:0.4;}
  .card.drag-over-top{box-shadow:inset 0 3px 0 0 var(--cyan);}
  .card.drag-over-bottom{box-shadow:inset 0 -3px 0 0 var(--cyan);}
  .icon-btn.pin-active{color:var(--amber);}
  .icon-btn.pin-active:hover{color:var(--amber);}
  .card-head{
    display:flex; align-items:center; gap:8px;
    padding-bottom:10px; margin-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .cat-dot{width:8px; height:8px; border-radius:2px; flex-shrink:0;}
  .cat-icon{font-size:15px; line-height:1; flex-shrink:0;}
  .icon-preset-row{display:flex; flex-wrap:wrap; gap:4px; margin-top:8px;}
  .icon-preset-btn{
    background:var(--bg); border:1px solid var(--line); border-radius:6px;
    font-size:15px; padding:4px 6px; cursor:pointer; line-height:1;
  }
  .icon-preset-btn:hover{border-color:var(--muted);}
  .trash-item{
    display:flex; align-items:center; gap:8px;
    padding:9px 0; border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .trash-item:last-child{border-bottom:none;}
  .trash-item .ti-info{flex:1; min-width:0;}
  .trash-item .ti-title{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .trash-item .ti-meta{font-size:11px; color:var(--muted); font-family:var(--mono);}
  .trash-item .ti-actions{display:flex; gap:4px; flex-shrink:0;}
  .trash-item .ti-actions button{
    font-size:11px; padding:5px 8px; border-radius:6px; border:1px solid var(--line);
    background:transparent; color:var(--muted); cursor:pointer; font-family:var(--sans);
  }
  .trash-item .ti-actions button:hover{color:var(--text); border-color:var(--muted);}
  .trash-item .ti-actions button.danger-text:hover{color:var(--danger); border-color:var(--danger);}
  .cat-drag-handle{
    flex-shrink:0; width:12px; text-align:center;
    color:var(--muted); font-size:12px; letter-spacing:-2px;
    opacity:0.35; cursor:grab; user-select:none;
  }
  .card:hover .cat-drag-handle{opacity:0.75;}
  .cat-name{
    font-family:var(--mono);
    font-size:calc(14px * var(--text-scale)); font-weight:700;
    letter-spacing:0.1em;
    text-transform:uppercase;
    flex:1;
    background:transparent; border:none; color:var(--text);
    outline:none;
    min-width:0;
    padding:2px 0;
  }
  .cat-count{
    font-family:var(--mono);
    font-size:calc(10px * var(--text-scale));
    color:var(--muted);
    background:rgba(255,255,255,0.04);
    border-radius:10px;
    padding:2px 7px;
  }
  .icon-btn{
    background:transparent; border:none; cursor:pointer;
    color:var(--muted);
    padding:4px; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    transition:color .15s, background .15s;
  }
  .icon-btn:hover{color:var(--text); background:rgba(255,255,255,0.06);}
  .icon-btn.danger:hover{color:var(--danger);}

  .link-list.is-collapsed .link-row:last-child{
    mask-image:linear-gradient(to bottom, black 15%, transparent 95%);
    -webkit-mask-image:linear-gradient(to bottom, black 15%, transparent 95%);
    pointer-events:none;
  }
  .link-list{display:flex; flex-direction:column; gap:0px;}
  .link-list.favorites-flow{flex-direction:row; flex-wrap:wrap; gap:5px;}
  .link-row.compact{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:7px;
    padding:3px 7px;
    width:auto;
  }
  .link-row.compact .link-title{flex:none; max-width:150px; font-size:calc(12.5px * var(--text-scale));}
  .link-row.compact:hover{background:var(--panel-hover);}
  .link-row{
    display:flex; align-items:center; gap:8px;
    padding:4px 6px;
    border-radius:6px;
    background:transparent;
  }
  .link-row:hover{background:var(--panel-hover);}
  .drag-handle{
    flex-shrink:0; width:10px; text-align:center;
    color:var(--muted); font-size:11px; letter-spacing:-2px;
    opacity:0.35; cursor:grab; user-select:none;
  }
  .link-row:hover .drag-handle{opacity:0.75;}
  .link-fav{width:16px; height:16px; flex-shrink:0; border-radius:3px; opacity:0.9;}
  .link-title{
    flex:1; min-width:0;
    font-size:calc(14px * var(--text-scale));
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .link-row a.link-title:hover{color:var(--cyan); text-decoration:underline;}
  .link-actions{
    display:flex; gap:2px; flex-shrink:0;
    opacity:0; pointer-events:none;
  }
  .link-row:hover .link-actions{opacity:1; pointer-events:auto;}
  .link-row.dragging{opacity:0.35;}
  .link-row.drag-over-top{box-shadow:inset 0 2px 0 0 var(--cyan);}
  .link-row.drag-over-bottom{box-shadow:inset 0 -2px 0 0 var(--cyan);}
  .link-list.drag-over-empty{
    outline:1px dashed var(--cyan); outline-offset:2px; border-radius:7px;
  }

  .add-link-btn{
    margin-top:6px;
    display:flex; align-items:center; gap:6px;
    font-family:var(--mono);
    font-size:calc(11px * var(--text-scale));
    color:var(--muted);
    background:transparent;
    border:1px dashed var(--line);
    border-radius:7px;
    padding:7px 10px;
    cursor:pointer;
    transition:color .15s, border-color .15s;
  }
  .add-link-btn:hover{color:var(--cyan); border-color:var(--cyan);}
  .card-footer-actions{display:flex; gap:6px; margin-top:6px;}
  .card-footer-actions .add-link-btn{margin-top:0; flex:1;}

  .subcat-block{
    margin-top:10px;
    padding-left:10px;
    border-left:2px solid var(--line);
  }
  .subcat-head{
    display:flex; align-items:center; gap:6px;
    padding:2px 0 4px;
  }
  .subcat-name{
    font-family:var(--mono);
    font-size:calc(11px * var(--text-scale));
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
    flex:1;
  }

  .card.add-category{
    align-items:center; justify-content:center;
    min-height:120px;
    border-style:dashed;
    cursor:pointer;
    color:var(--muted);
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.08em;
    gap:8px;
  }
  .card.add-category:hover{color:var(--cyan); border-color:var(--cyan);}

  .empty{
    text-align:center; padding:60px 20px; color:var(--muted);
    font-family:var(--mono); font-size:13px; letter-spacing:0.04em;
  }

  /* ---- Modal ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(4,5,8,0.7);
    display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px;
    backdrop-filter:blur(2px);
  }
  .overlay.hidden{display:none;}
  .modal{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    width:100%; max-width:380px;
    padding:20px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .modal h3{
    margin:0 0 16px; font-family:var(--mono);
    font-size:13px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--cyan);
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block; font-size:11px; color:var(--muted);
    margin-bottom:5px; font-family:var(--mono); letter-spacing:0.05em;
  }
  .field input, .field select{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:7px;
    padding:9px 10px;
    font-size:13px;
    font-family:var(--sans);
    outline:none;
  }
  .field input:focus, .field select:focus{border-color:var(--blue);}
  .palette-row{display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;}
  .palette-swatch{
    width:30px; height:30px; border-radius:50%;
    border:2px solid transparent; cursor:pointer; padding:0;
    box-shadow:0 0 0 1px var(--line);
  }
  .palette-swatch.selected{border-color:var(--text);}
  .modal-actions{display:flex; gap:8px; margin-top:18px; justify-content:flex-end;}
  .modal-actions .btn.cancel{background:transparent; color:var(--muted); border:1px solid var(--line);}
  .modal-actions .btn.danger-fill{background:var(--danger); color:#1a0a0a;}
  .modal p.confirm-text{font-size:13px; color:var(--muted); line-height:1.5; margin:0 0 4px;}

  /* ---- Back to top ---- */
  .back-to-top{
    position:fixed;
    bottom:24px; right:24px;
    width:44px; height:44px;
    border-radius:50%;
    background:var(--blue);
    color:#0a0c12;
    border:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,0.45);
    opacity:0; transform:translateY(8px);
    pointer-events:none;
    transition:opacity .2s, transform .2s, filter .15s;
    z-index:50;
  }
  .back-to-top.visible{opacity:1; transform:translateY(0); pointer-events:auto;}
  .back-to-top:hover{filter:brightness(1.12);}

  @media (max-width:520px){
    .topbar{padding:12px 14px 8px;}
    .cat-nav{padding:0 14px 12px;}
    .grid{padding:14px; gap:12px;}
    .brand{font-size:17px;}
    .back-to-top{bottom:18px; right:18px; width:40px; height:40px;}
  }
</style>

  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

  function findLinkContext(catId, subcatId, linkId){
    const cat = state.categories.find(c => c.id === catId);
    if(!cat) return null;
    const arr = subcatId ? (cat.subcategories || []).find(s => s.id === subcatId)?.links : cat.links;
    if(!arr) return null;
    const link = arr.find(l => l.id === linkId);
    if(!link) return null;
    return { cat, arr, link };
  }

    return {

        color: PALETTE[i % PALETTE.length],
        links: cat.links.map(([title,url]) => ({ id: uid(), title, url }))
      }))
    };
  }

  let state = null;
  let saveTimer = null;
  let lastError = '';
  const statusEl = () => document.getElementById('saveStatus');

  function setSaving(on, error, errorDetail){
    const el = statusEl();
    if(!el) return;
    el.querySelector('.dot').classList.toggle('saving', !!on);
    el.querySelector('.dot').classList.toggle('error', !!error);
    el.querySelector('span.txt').textContent = error ? 'sin conexión (clic para ver el error)' : (on ? 'guardando…' : 'sincronizado');
    if(errorDetail) lastError = errorDetail;
    el.style.cursor = error ? 'pointer' : 'default';
  }

  function persist(){
    setSaving(true);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try{
        const res = await fetch(JSONBIN_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': JSONBIN_KEY
          },
          body: JSON.stringify(state)
        });
        if(!res.ok){
          let detail = 'HTTP ' + res.status;
          try{ const body = await res.json(); if(body && body.message) detail += ' — ' + body.message; }catch(e){}
          throw new Error(detail);
        }
        setSaving(false);
      }catch(e){
        console.error('Error guardando en JSONBin', e);
        setSaving(false, true, 'No se pudo GUARDAR: ' + e.message);
      }
    }, 500);
  }

  async function loadState(){
    try{
      const res = await fetch(JSONBIN_URL + '/latest', {
        headers: { 'X-Master-Key': JSONBIN_KEY }
      });
      if(!res.ok){
        let detail = 'HTTP ' + res.status;
        try{ const body = await res.json(); if(body && body.message) detail += ' — ' + body.message; }catch(e){}
        throw new Error(detail);
      }
      const data = await res.json();
      if(data && data.record && Array.isArray(data.record.categories)){
        state = data.record;
        state.trash = state.trash || [];
        const THIRTY_DAYS = 30 * 24 * 60 * 60 * 1000;
        const before = state.trash.length;
        state.trash = state.trash.filter(item => (Date.now() - (item.deletedAt || 0)) < THIRTY_DAYS);
        if(state.trash.length !== before) persist();
        return;
      }
      throw new Error('Respuesta inesperada de JSONBin');
    }catch(e){
      console.error('Error cargando de JSONBin', e);
      setSaving(false, true, 'No se pudo CARGAR: ' + e.message);
      state = buildSeedState();
    }
  }

  function faviconFor(url){
    try{
      const u = new URL(url);
      if(u.protocol === 'http:' || u.protocol === 'https:'){
        return 'https://www.google.com/s2/favicons?sz=32&domain=' + u.hostname;
      }
    }catch(e){}
    return '';
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- Rendering ----------
  const root = document.getElementById('app');

  function renderFavoritesBar(){
    const pinned = [];
    state.categories.forEach(cat => {
      cat.links.forEach(l => { if(l.pinned) pinned.push(renderLinkRow(l, cat.id, { showHandle: false, compact: true })); });
    });
    if(pinned.length === 0) return '';
    const open = state.settings?.favBarOpen !== false;
    return `
    <div class="fav-bar-wrap">
      <button class="fav-toggle" data-action="toggle-favbar" title="${open ? 'Ocultar favoritos' : 'Mostrar favoritos'}">
        ⭐
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="transform:rotate(${open ? '0' : '-90'}deg); transition:transform .15s;"><path d="m6 9 6 6 6-6"/></svg>
        <span class="cat-count">${pinned.length}</span>
      </button>
      ${open ? `<div class="fav-bar">${pinned.join('')}</div>` : ''}
    </div>`;
  }

  function render(){
    const query = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();

    let html = '';
    html += renderTopbar(query);
    html += '<main class="grid" id="grid">';


    const cats = state.categories;
    let anyVisible = false;
    const draggableEnabled = !query;

    cats.forEach(cat => {
      const filteredLinks = query
        ? cat.links.filter(l => l.title.toLowerCase().includes(query) || l.url.toLowerCase().includes(query))
        : cat.links;
      if(query && filteredLinks.length === 0) return;
      anyVisible = true;
      html += renderCard(cat, filteredLinks, draggableEnabled, !query);
    });

    html += `<div class="card add-category" data-action="add-category">
      <div style="font-size:20px;">+</div>
      <div>NUEVA CATEGORÍA</div>
    </div>`;

    html += '</main>';

    if(!anyVisible && query){
      html += `<div class="empty">Sin resultados para "${esc(query)}"</div>`;
    }

    root.innerHTML = html;
    attachEvents();
    const s = document.getElementById('searchInput');
    if(s) { s.focus({preventScroll:true}); const val = s.value; s.value=''; s.value = val; }
  }

  function renderTopbar(query){
    const navPills = state.categories.map(c => `
      <button class="cat-nav-pill" draggable="true" data-cat-id="${c.id}" data-scroll-to="cat-${c.id}">

    return `

        <div class="brand"><span class="i">i</span><span class="portal">Portal</span></div>
        <div class="search-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="searchInput" placeholder="Buscar enlaces..." value="${esc(query)}" autocomplete="off"/>
        </div>
        <div class="topbar-actions">
          <div class="status" id="saveStatus"><span class="dot"></span><span class="txt">sincronizado</span></div>
          <button class="btn ghost" data-action="open-trash" title="Papelera">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
            ${(state.trash || []).length ? `<span class="trash-count">${state.trash.length}</span>` : ''}
          </button>
          <button class="btn ghost" data-action="open-settings" title="Personalizar">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

        </div>
      </header>
      ${state.categories.length ? `<nav class="cat-nav" id="catNav">${navPills}</nav>` : ''}
      ${renderFavoritesBar()}
    </div>`;
  }

  function cardBgStyle(cat){
    const bg = cat.bg;
    if(!bg || bg.type === 'none' || !bg.value) return '';
    if(bg.type === 'color'){
      return ` style="background:${esc(bg.value)};"`;
    }
    if(bg.type === 'image'){
      const url = esc(bg.value).replace(/"/g,'&quot;');
      return ` style="background-image:linear-gradient(rgba(15,17,23,.74),rgba(15,17,23,.74)), url(&quot;${url}&quot;);"`;
    }
    return '';
  }

  function renderLinkRow(l, catId, opts){
    opts = opts || {};
    const draggableEnabled = opts.draggable !== false;
    const pinned = !!l.pinned;
    const tooltip = l.description ? `${l.description}\n${l.url}` : l.url;
    return `
      <div class="link-row${opts.compact ? ' compact' : ''}" data-link-id="${l.id}" data-cat-id="${catId}" data-subcat-id="${opts.subcatId || ''}">
        ${opts.showHandle === false ? '' : `<span class="drag-handle" draggable="${draggableEnabled}">⠿</span>`}
        <img class="link-fav" src="${faviconFor(l.url)}" alt="" draggable="false" loading="lazy" decoding="async" onerror="this.style.visibility='hidden'"/>
        <a class="link-title" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer" draggable="false" title="${esc(tooltip)}">${esc(l.title)}</a>
        <div class="link-actions">
          <button class="icon-btn ${pinned ? 'pin-active' : ''}" data-action="toggle-pin" title="${pinned ? 'Quitar de favoritos' : 'Marcar como favorito'}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="${pinned ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </button>
          <button class="icon-btn" data-action="edit-link" title="Editar">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
          <button class="icon-btn danger" data-action="delete-link" title="Eliminar">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
      </div>`;
  }

  function renderCard(cat, links, draggableEnabled, allowCollapse){
    const isCollapsed = !!(allowCollapse && cat.collapsed && links.length > 2);
    const displayLinks = isCollapsed ? links.slice(0, 3) : links;
    const rows = displayLinks.map(l => renderLinkRow(l, cat.id, { draggable: draggableEnabled && !isCollapsed })).join('');
    const hiddenCount = links.length - displayLinks.length;

    return `
    <div class="card" id="cat-${cat.id}" data-cat-id="${cat.id}"${cardBgStyle(cat)}>
      <div class="card-head">
        <span class="cat-drag-handle" draggable="true" title="Arrastrar para reordenar categoría">⠿</span>
        ${cat.icon ? `<span class="cat-icon" title="${esc(cat.icon)}">${esc(cat.icon)}</span>` : `<div class="cat-dot" style="background:${cat.color}"></div>`}
        <input class="cat-name" data-action="rename-category" data-cat-id="${cat.id}" value="${esc(cat.name)}" />
        <span class="cat-count">${links.length}</span>
        ${links.length > 2 ? `
        <button class="icon-btn" data-action="toggle-collapse" data-cat-id="${cat.id}" title="${cat.collapsed ? 'Expandir' : 'Colapsar'}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="transform:rotate(${cat.collapsed ? '-90' : '0'}deg); transition:transform .15s;"><path d="m6 9 6 6 6-6"/></svg>
        </button>` : ''}
        <button class="icon-btn" data-action="edit-appearance" data-cat-id="${cat.id}" title="Apariencia de la categoría">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.5-.7 1.5-1.5 0-.4-.2-.8-.4-1.1-.2-.3-.4-.6-.4-1 0-.8.7-1.4 1.4-1.4H16c3.3 0 6-2.7 6-6 0-4.4-4-8-10-8z"/></svg>
        </button>
        <button class="icon-btn danger" data-action="delete-category" data-cat-id="${cat.id}" title="Eliminar categoría">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="link-list${isCollapsed ? ' is-collapsed' : ''}" data-cat-id="${cat.id}" data-subcat-id="">${rows || (cat.links.length === 0 ? '<div style="color:var(--muted);font-size:12px;padding:8px 6px;">Sin enlaces</div>' : '')}</div>
      ${!isCollapsed ? (cat.subcategories || []).map(sub => renderSubcategoryBlock(cat, sub, draggableEnabled)).join('') : ''}
      ${isCollapsed
        ? `<button class="add-link-btn" data-action="toggle-collapse" data-cat-id="${cat.id}">+ ${hiddenCount} más… (mostrar todo)</button>`
        : `<div class="card-footer-actions">
            <button class="add-link-btn" data-action="add-link" data-cat-id="${cat.id}">+ enlace</button>
            <button class="add-link-btn" data-action="add-subcategory" data-cat-id="${cat.id}">+ subcategoría</button>
          </div>`}
    </div>`;
  }

  function renderSubcategoryBlock(cat, sub, draggableEnabled){
    const rows = sub.links.map(l => renderLinkRow(l, cat.id, { draggable: draggableEnabled, subcatId: sub.id })).join('');
    return `
    <div class="subcat-block">
      <div class="subcat-head">
        <span class="subcat-name">${esc(sub.name)}</span>
        <span class="cat-count">${sub.links.length}</span>
        <button class="icon-btn danger" data-action="delete-subcategory" data-cat-id="${cat.id}" data-subcat-id="${sub.id}" title="Eliminar subcategoría">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="link-list" data-cat-id="${cat.id}" data-subcat-id="${sub.id}">${rows || '<div style="color:var(--muted);font-size:11px;padding:6px;">Sin enlaces</div>'}</div>
    </div>`;
  }

  // ---------- Modals ----------
  function openModal(innerHtml){
    const wrap = document.createElement('div');
    wrap.className = 'overlay';
    wrap.id = 'overlay';
    wrap.innerHTML = `<div class="modal">${innerHtml}</div>`;
    wrap.addEventListener('click', (e) => { if(e.target === wrap) closeModal(); });
    document.body.appendChild(wrap);
  }
  function closeModal(){
    const o = document.getElementById('overlay');
    if(o) o.remove();
  }

  function subcatOptionsFor(catId, selectedSubcatId){
    const cat = state.categories.find(c => c.id === catId);
    const subs = cat?.subcategories || [];
    let opts = `<option value="" ${!selectedSubcatId ? 'selected' : ''}>— Directamente en la categoría —</option>`;
    opts += subs.map(s => `<option value="${s.id}" ${s.id === selectedSubcatId ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
    return opts;
  }

    const isEdit = !!link;

      `<option value="${c.id}" ${c.id === catId ? 'selected' : ''}>${esc(c.name)}</option>`
    ).join('');

  function openCategoryForm(){
    openModal(`
      <h3>Nueva categoría</h3>
      <div class="field">
        <label>Nombre</label>
        <input id="f-cat-name" placeholder="Ej. TRABAJO" />

  function openSubcategoryForm(catId){
    openModal(`
      <h3>Nueva subcategoría</h3>
      <div class="field">
        <label>Nombre</label>
        <input id="f-subcat-name" placeholder="Ej. Bancos" />

      </div>

    setTimeout(() => document.getElementById('f-subcat-name')?.focus(), 30);

  function openConfirm(text, onConfirm){
    openModal(`
      <h3>Confirmar</h3>
      <p class="confirm-text">${esc(text)}</p>
      <div class="modal-actions">
        <button class="btn cancel" data-action="close-modal">Cancelar</button>
        <button class="btn danger-fill" id="confirmBtn">Eliminar</button>
      </div>
    `);
    document.getElementById('confirmBtn').addEventListener('click', () => {
      closeModal();
      onConfirm();
    });
  }

  function timeAgo(ts){
    const diff = Date.now() - ts;
    const mins = Math.floor(diff / 60000);
    if(mins < 1) return 'ahora mismo';
    if(mins < 60) return `hace ${mins} min`;
    const hours = Math.floor(mins / 60);
    if(hours < 24) return `hace ${hours} h`;
    const days = Math.floor(hours / 24);
    return `hace ${days} día${days === 1 ? '' : 's'}`;
  }

  function openTrashForm(){
    const trash = state.trash || [];
    const items = trash.map((item, idx) => {
      let title, meta;
      if(item.type === 'link'){
        title = item.link.title;
        meta = `de "${esc(item.catName || '')}" · ${timeAgo(item.deletedAt)}`;
      } else if(item.type === 'subcategory'){
        title = `Subcategoría: ${item.subcategory.name}`;
        meta = `de "${esc(item.catName || '')}" · ${item.subcategory.links.length} enlaces · ${timeAgo(item.deletedAt)}`;
      } else {
        title = `Categoría: ${item.category.name}`;
        meta = `${item.category.links.length} enlaces · ${timeAgo(item.deletedAt)}`;
      }
      return `
        <div class="trash-item">
          <div class="ti-info">
            <div class="ti-title">${esc(title)}</div>
            <div class="ti-meta">${meta}</div>
          </div>
          <div class="ti-actions">
            <button data-action="restore-trash" data-idx="${idx}">Restaurar</button>
            <button class="danger-text" data-action="purge-trash-item" data-idx="${idx}">Eliminar</button>
          </div>
        </div>`;
    }).join('');

    openModal(`
      <h3>Papelera</h3>
      ${trash.length ? items : '<p class="confirm-text">La papelera está vacía.</p>'}
      <div class="modal-actions">
        ${trash.length ? '<button class="btn cancel danger-fill" data-action="empty-trash">Vaciar papelera</button>' : ''}
        <button class="btn cancel" data-action="close-modal">Cerrar</button>
      </div>
    `);
  }

  const ICON_PRESETS = ['📌','🏦','✍️','🎮','🛒','📺','💪','📰','🎬','🎵','💻','📚','✈️','🍔','🏠','⚙️'];

  function openAppearanceForm(catId){
    const cat = state.categories.find(c => c.id === catId);
    if(!cat) return;
    const bg = cat.bg || { type: 'none', value: '' };
    const iconPresetBtns = ICON_PRESETS.map(ic => `<button type="button" class="icon-preset-btn" data-icon="${ic}">${ic}</button>`).join('');
    openModal(`
      <h3>Apariencia — ${esc(cat.name)}</h3>
      <div class="field">
        <label>Icono (emoji, opcional)</label>
        <input id="ap-icon" value="${esc(cat.icon || '')}" maxlength="4" placeholder="Ej. 🏦" style="width:70px; text-align:center; font-size:18px;"/>
        <div class="icon-preset-row">${iconPresetBtns}</div>
      </div>
      <div class="field">
        <label>Tipo de fondo</label>
        <select id="ap-type">
          <option value="none" ${bg.type==='none'?'selected':''}>Predeterminado</option>
          <option value="color" ${bg.type==='color'?'selected':''}>Color sólido</option>
          <option value="image" ${bg.type==='image'?'selected':''}>Imagen (por URL)</option>
        </select>
      </div>
      <div class="field" id="ap-color-field" style="${bg.type==='color'?'':'display:none;'}">
        <label>Color</label>
        <input id="ap-color" type="color" value="${bg.type==='color' && bg.value ? esc(bg.value) : '#161923'}" style="height:38px; padding:4px;"/>
      </div>
      <div class="field" id="ap-image-field" style="${bg.type==='image'?'':'display:none;'}">
        <label>URL de la imagen</label>
        <input id="ap-image" value="${bg.type==='image' ? esc(bg.value) : ''}" placeholder="https://..." />
      </div>
      <div class="modal-actions">
        <button class="btn cancel" data-action="close-modal">Cancelar</button>
        <button class="btn" data-action="save-appearance" data-cat-id="${catId}">Guardar</button>
      </div>
    `);
    document.querySelectorAll('.icon-preset-btn').forEach(btn => {
      btn.addEventListener('click', () => { document.getElementById('ap-icon').value = btn.dataset.icon; });
    });
    const typeSel = document.getElementById('ap-type');
    typeSel.addEventListener('change', () => {
      document.getElementById('ap-color-field').style.display = typeSel.value === 'color' ? '' : 'none';
      document.getElementById('ap-image-field').style.display = typeSel.value === 'image' ? '' : 'none';
    });
  }

  const FONT_OPTIONS = {
    default:   { label: 'Predeterminada (dual)', sans: "'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif", mono: "'JetBrains Mono','SF Mono',Consolas,monospace" },
    inter:     { label: 'Inter (moderna)',        sans: "'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif", mono: "'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" },
    georgia:   { label: 'Serif clásica',          sans: "Georgia,'Times New Roman',serif", mono: "Georgia,'Times New Roman',serif" },
    courier:   { label: 'Monoespaciada',          sans: "'Courier New',Courier,monospace", mono: "'Courier New',Courier,monospace" },
    trebuchet: { label: 'Redondeada',             sans: "'Trebuchet MS',sans-serif", mono: "'Trebuchet MS',sans-serif" },
    jetbrains: { label: 'Técnica',                sans: "'JetBrains Mono','SF Mono',Consolas,monospace", mono: "'JetBrains Mono','SF Mono',Consolas,monospace" }
  };
  const SIZE_OPTIONS = { small: { label: 'Pequeño', scale: 0.88 }, medium: { label: 'Medio', scale: 1 }, large: { label: 'Grande', scale: 1.18 } };

  const THEMES = {
    dark:  { label: 'Oscuro', bg:'#07080c', panel:'#111319', panelHover:'#161923', line:'#22242e', muted:'#7d8194', defaultText:'#e9eaf2' },
    light: { label: 'Claro',  bg:'#eef0f4', panel:'#ffffff', panelHover:'#f4f6f9', line:'#dde1e8', muted:'#6b7280', defaultText:'#16181f' }
  };
  const THEME_DEFAULT_TEXTS = [THEMES.dark.defaultText, THEMES.light.defaultText];

  const PALETTES = {
    azul:    { label: 'Azul',    c1:'#4d7cff', c2:'#5eead4' },
    ocre:    { label: 'Ocre',    c1:'#c9902c', c2:'#eac877' },
    rojos:   { label: 'Rojos',   c1:'#e0524f', c2:'#ff9d8a' },
    verdes:  { label: 'Verdes',  c1:'#3fae6a', c2:'#8be6a8' },
    morados: { label: 'Morados', c1:'#8b5cf6', c2:'#c9b6fb' },
    rosas:   { label: 'Rosas',   c1:'#e0559a', c2:'#ffb0d6' }
  };

  function openSettingsForm(){
    const s = Object.assign({ fontFamily:'default', fontSize:'medium', textColor:'#e9eaf2', theme:'dark', colorPalette:'azul', pageBg:{type:'default',value:''} }, state.settings || {});
    const fontOpts = Object.entries(FONT_OPTIONS).map(([k,v]) => `<option value="${k}" ${s.fontFamily===k?'selected':''}>${esc(v.label)}</option>`).join('');
    const sizeOpts = Object.entries(SIZE_OPTIONS).map(([k,v]) => `<option value="${k}" ${s.fontSize===k?'selected':''}>${esc(v.label)}</option>`).join('');
    const themeOpts = Object.entries(THEMES).map(([k,v]) => `<option value="${k}" ${s.theme===k?'selected':''}>${esc(v.label)}</option>`).join('');
    const paletteSwatches = Object.entries(PALETTES).map(([k,v]) => `
      <button type="button" class="palette-swatch ${s.colorPalette===k?'selected':''}" data-palette="${k}" title="${esc(v.label)}" style="background:linear-gradient(135deg, ${v.c1}, ${v.c2});"></button>
    `).join('');
    const pageBg = s.pageBg || { type:'default', value:'' };

    openModal(`
      <h3>Personalizar iPortal</h3>
      <div class="field">
        <label>Tema</label>
        <select id="st-theme">${themeOpts}</select>
      </div>
      <div class="field">
        <label>Paleta de color</label>
        <div class="palette-row">${paletteSwatches}</div>
        <input type="hidden" id="st-palette" value="${esc(s.colorPalette)}" />
      </div>
      <div class="field">
        <label>Tipo de letra</label>
        <select id="st-font">${fontOpts}</select>
      </div>
      <div class="field">
        <label>Tamaño de texto</label>
        <select id="st-size">${sizeOpts}</select>
      </div>
      <div class="field">
        <label>Color del texto</label>
        <input id="st-color" type="color" value="${esc(s.textColor)}" style="height:38px; padding:4px;"/>
      </div>
      <div class="field">
        <label>Fondo de la página</label>
        <select id="st-bg-type">
          <option value="default" ${pageBg.type==='default'?'selected':''}>Predeterminado</option>
          <option value="color" ${pageBg.type==='color'?'selected':''}>Color sólido</option>
          <option value="image" ${pageBg.type==='image'?'selected':''}>Imagen (por URL)</option>
        </select>
      </div>
      <div class="field" id="st-bgcolor-field" style="${pageBg.type==='color'?'':'display:none;'}">
        <label>Color de fondo</label>
        <input id="st-bg-color" type="color" value="${pageBg.type==='color' && pageBg.value ? esc(pageBg.value) : '#07080c'}" style="height:38px; padding:4px;"/>
      </div>
      <div class="field" id="st-bgimage-field" style="${pageBg.type==='image'?'':'display:none;'}">
        <label>URL de la imagen</label>
        <input id="st-bg-image" value="${pageBg.type==='image' ? esc(pageBg.value) : ''}" placeholder="https://..." />
      </div>
      <div class="modal-actions">
        <button class="btn cancel" data-action="reset-settings">Restablecer</button>
        <button class="btn cancel" data-action="close-modal">Cancelar</button>
        <button class="btn" data-action="save-settings">Guardar</button>
      </div>
    `);
    document.querySelectorAll('.palette-swatch').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('st-palette').value = btn.dataset.palette;
        document.querySelectorAll('.palette-swatch').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });
    const bgTypeSel = document.getElementById('st-bg-type');
    bgTypeSel.addEventListener('change', () => {
      document.getElementById('st-bgcolor-field').style.display = bgTypeSel.value === 'color' ? '' : 'none';
      document.getElementById('st-bgimage-field').style.display = bgTypeSel.value === 'image' ? '' : 'none';
    });
    const themeSel = document.getElementById('st-theme');
    themeSel.addEventListener('change', () => {
      const colorInput = document.getElementById('st-color');
      if(THEME_DEFAULT_TEXTS.includes(colorInput.value.toLowerCase())){
        colorInput.value = THEMES[themeSel.value].defaultText;
      }
    });
  }

  function applySettings(){
    const s = Object.assign({ fontFamily:'default', fontSize:'medium', textColor:'#e9eaf2', theme:'dark', pageBg:{type:'default',value:''} }, state.settings || {});
    const root = document.documentElement;
    const font = FONT_OPTIONS[s.fontFamily] || FONT_OPTIONS.default;
    root.style.setProperty('--sans', font.sans);
    root.style.setProperty('--mono', font.mono);
    root.style.setProperty('--text-scale', (SIZE_OPTIONS[s.fontSize] || SIZE_OPTIONS.medium).scale);
    root.style.setProperty('--text', s.textColor || '#e9eaf2');

    const theme = THEMES[s.theme] || THEMES.dark;
    root.style.setProperty('--bg', theme.bg);
    root.style.setProperty('--panel', theme.panel);
    root.style.setProperty('--panel-hover', theme.panelHover);
    root.style.setProperty('--line', theme.line);
    root.style.setProperty('--muted', theme.muted);

    const palette = PALETTES[s.colorPalette] || PALETTES.azul;
    root.style.setProperty('--blue', palette.c1);
    root.style.setProperty('--cyan', palette.c2);

    const pageBg = s.pageBg || { type: 'default', value: '' };
    const appEl = document.getElementById('app');
    if(!appEl) return;
    appEl.classList.toggle('theme-light', s.theme === 'light');
    if(pageBg.type === 'color' && pageBg.value){
      appEl.style.background = pageBg.value;
    } else if(pageBg.type === 'image' && pageBg.value){
      const url = pageBg.value.replace(/'/g, "%27");
      appEl.style.background = `linear-gradient(rgba(7,8,12,.62),rgba(7,8,12,.62)), url('${url}') center/cover no-repeat`;
    } else {
      appEl.style.background = '';
    }
  }

  // ---------- Event wiring ----------
  function attachEvents(){
    const searchInput = document.getElementById('searchInput');
    if(searchInput){
      searchInput.addEventListener('input', () => render());
      searchInput.addEventListener('keydown', e => { if(e.key === 'Escape'){ searchInput.value=''; render(); } });
    }

    root.querySelectorAll('[data-action="rename-category"]').forEach(inp => {
      inp.addEventListener('change', () => {
        const cat = state.categories.find(c => c.id === inp.dataset.catId);
        if(cat && inp.value.trim()){ cat.name = inp.value.trim(); persist(); }
      });
      inp.addEventListener('keydown', e => { if(e.key === 'Enter') inp.blur(); });
    });

    root.querySelectorAll('[data-action="delete-category"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = state.categories.find(c => c.id === btn.dataset.catId);
        if(!cat) return;
        openConfirm(`Se eliminará la categoría "${cat.name}" y sus ${cat.links.length} enlaces. Podrás recuperarla desde la papelera.`, () => {
          state.categories = state.categories.filter(c => c.id !== cat.id);
          state.trash = state.trash || [];
          state.trash.unshift({ type: 'category', category: cat, deletedAt: Date.now() });
          persist(); render();
        });
      });
    });

    root.querySelectorAll('[data-action="edit-appearance"]').forEach(btn => {
      btn.addEventListener('click', () => openAppearanceForm(btn.dataset.catId));
    });

    const settingsBtn = root.querySelector('[data-action="open-settings"]');
    if(settingsBtn) settingsBtn.addEventListener('click', openSettingsForm);

    const trashBtn = root.querySelector('[data-action="open-trash"]');
    if(trashBtn) trashBtn.addEventListener('click', openTrashForm);


    root.querySelectorAll('[data-action="add-link"]').forEach(btn => {
      btn.addEventListener('click', () => openLinkForm({ catId: btn.dataset.catId, link: null }));
    });

    const addLinkGlobal = root.querySelector('[data-action="add-link-global"]');
    if(addLinkGlobal){
      addLinkGlobal.addEventListener('click', () => openLinkForm({ catId: state.categories[0]?.id, link: null }));
    }

    root.querySelectorAll('[data-action="edit-link"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const row = btn.closest('.link-row');
        const ctx = findLinkContext(row.dataset.catId, row.dataset.subcatId, row.dataset.linkId);
        if(ctx) openLinkForm({ catId: ctx.cat.id, subcatId: row.dataset.subcatId || '', link: ctx.link });
      });
    });

    root.querySelectorAll('[data-action="toggle-pin"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const row = btn.closest('.link-row');
        const ctx = findLinkContext(row.dataset.catId, row.dataset.subcatId, row.dataset.linkId);
        if(!ctx) return;
        ctx.link.pinned = !ctx.link.pinned;
        persist(); render();
      });
    });

    root.querySelectorAll('[data-action="delete-link"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const row = btn.closest('.link-row');
        const ctx = findLinkContext(row.dataset.catId, row.dataset.subcatId, row.dataset.linkId);
        if(!ctx) return;
        openConfirm(`Se eliminará el enlace "${ctx.link.title}". Podrás recuperarlo desde la papelera.`, () => {
          const idx = ctx.arr.findIndex(l => l.id === ctx.link.id);
          if(idx !== -1) ctx.arr.splice(idx, 1);
          state.trash = state.trash || [];
          state.trash.unshift({ type: 'link', catId: ctx.cat.id, catName: ctx.cat.name, link: ctx.link, deletedAt: Date.now() });
          persist(); render();
        });
      });
    });

    const addCatCard = root.querySelector('[data-action="add-category"]');
    if(addCatCard) addCatCard.addEventListener('click', openCategoryForm);

    root.querySelectorAll('[data-action="add-subcategory"]').forEach(btn => {
      btn.addEventListener('click', () => openSubcategoryForm(btn.dataset.catId));
    });

    const statusBtn = document.getElementById('saveStatus');
    if(statusBtn){
      statusBtn.addEventListener('click', () => {
        if(!statusBtn.querySelector('.dot').classList.contains('error')) return;
        openModal(`
          <h3>Detalle del error</h3>
          <p class="confirm-text" style="word-break:break-word;">${esc(lastError || 'Error desconocido')}</p>
          <p class="confirm-text" style="margin-top:10px;">Causas más comunes: la clave X-MASTER-KEY no está bien copiada en el index.html, se han agotado las peticiones gratuitas de JSONBin, o no hay conexión a internet.</p>
          <div class="modal-actions">
            <button class="btn cancel" data-action="close-modal">Cerrar</button>
          </div>
        `);
      });
    }
  }

  document.addEventListener('click', (e) => {
    const toggleCollapse = e.target.closest('[data-action="toggle-collapse"]');
    if(toggleCollapse){
      const cat = state.categories.find(c => c.id === toggleCollapse.dataset.catId);
      if(!cat) return;
      cat.collapsed = !cat.collapsed;
      persist(); render();
      return;
    }

    const favToggle = e.target.closest('[data-action="toggle-favbar"]');
    if(favToggle){
      state.settings = state.settings || {};
      state.settings.favBarOpen = !(state.settings.favBarOpen !== false);
      persist(); render();
      return;
    }

    const navPill = e.target.closest('.cat-nav-pill');
    if(navPill){
      const target = document.getElementById(navPill.dataset.scrollTo);
      if(target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }

    if(e.target.closest('[data-action="close-modal"]')) closeModal();


    const saveCat = e.target.closest('[data-action="save-category"]');
    if(saveCat){
      const name = document.getElementById('f-cat-name').value.trim();
      if(!name) return;
      state.categories.push({
        id: uid(), name,
        color: PALETTE[state.categories.length % PALETTE.length],
        links: []
      });
      persist(); closeModal(); render();
      return;
    }

    const saveSubcat = e.target.closest('[data-action="save-subcategory"]');
    if(saveSubcat){
      const name = document.getElementById('f-subcat-name').value.trim();
      if(!name) return;
      const cat = state.categories.find(c => c.id === saveSubcat.dataset.catId);
      if(!cat) return;
      cat.subcategories = cat.subcategories || [];
      cat.subcategories.push({ id: uid(), name, links: [] });
      persist(); closeModal(); render();
      return;
    }

    const deleteSubcat = e.target.closest('[data-action="delete-subcategory"]');
    if(deleteSubcat){
      const cat = state.categories.find(c => c.id === deleteSubcat.dataset.catId);
      const sub = cat?.subcategories?.find(s => s.id === deleteSubcat.dataset.subcatId);
      if(!cat || !sub) return;
      openConfirm(`Se eliminará la subcategoría "${sub.name}" y sus ${sub.links.length} enlaces. Podrás recuperarla desde la papelera.`, () => {
        cat.subcategories = cat.subcategories.filter(s => s.id !== sub.id);
        state.trash = state.trash || [];
        state.trash.unshift({ type: 'subcategory', catId: cat.id, catName: cat.name, subcategory: sub, deletedAt: Date.now() });
        persist(); render();
      });
      return;
    }

    const saveLink = e.target.closest('[data-action="save-link"]');
    if(saveLink){
      const title = document.getElementById('f-title').value.trim();
      let url = document.getElementById('f-url').value.trim();
      const description = document.getElementById('f-desc').value.trim();
      const catId = document.getElementById('f-cat').value;
      const subcatId = document.getElementById('f-subcat')?.value || '';
      if(!title || !url) return;
      if(!/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(url)) url = 'https://' + url;

      const targetCat = state.categories.find(c => c.id === catId);
      if(!targetCat) return;
      const targetArr = subcatId ? (targetCat.subcategories || []).find(s => s.id === subcatId)?.links : targetCat.links;
      if(!targetArr) return;

      const linkId = saveLink.dataset.linkId;
      if(linkId){
        let found = null;
        for(const c of state.categories){
          const inRoot = c.links.find(l => l.id === linkId);
          if(inRoot){ found = { arr: c.links, link: inRoot }; break; }
          for(const s of (c.subcategories || [])){
            const inSub = s.links.find(l => l.id === linkId);
            if(inSub){ found = { arr: s.links, link: inSub }; break; }
          }
          if(found) break;
        }
        if(found){
          found.link.title = title; found.link.url = url; found.link.description = description;
          if(found.arr !== targetArr){
            const idx = found.arr.findIndex(l => l.id === linkId);
            if(idx !== -1) found.arr.splice(idx, 1);
            targetArr.push(found.link);
          }
        }
      } else {
        targetArr.push({ id: uid(), title, url, description });
      }
      persist(); closeModal(); render();
      return;
    }

    const saveAppearance = e.target.closest('[data-action="save-appearance"]');
    if(saveAppearance){
      const cat = state.categories.find(c => c.id === saveAppearance.dataset.catId);
      if(!cat) return;
      const type = document.getElementById('ap-type').value;
      if(type === 'color'){
        cat.bg = { type: 'color', value: document.getElementById('ap-color').value };
      } else if(type === 'image'){
        const url = document.getElementById('ap-image').value.trim();
        cat.bg = url ? { type: 'image', value: url } : { type: 'none', value: '' };
      } else {
        cat.bg = { type: 'none', value: '' };
      }
      cat.icon = document.getElementById('ap-icon').value.trim().slice(0, 4);
      persist(); closeModal(); render();
      return;
    }

    const saveSettings = e.target.closest('[data-action="save-settings"]');
    if(saveSettings){
      const bgType = document.getElementById('st-bg-type').value;
      let pageBg = { type: 'default', value: '' };
      if(bgType === 'color') pageBg = { type: 'color', value: document.getElementById('st-bg-color').value };
      if(bgType === 'image'){
        const url = document.getElementById('st-bg-image').value.trim();
        pageBg = url ? { type: 'image', value: url } : { type: 'default', value: '' };
      }
      state.settings = {
        ...(state.settings || {}),
        theme: document.getElementById('st-theme').value,
        colorPalette: document.getElementById('st-palette').value,
        fontFamily: document.getElementById('st-font').value,
        fontSize: document.getElementById('st-size').value,
        textColor: document.getElementById('st-color').value,
        pageBg
      };
      applySettings();
      persist(); closeModal(); render();
      return;
    }

    const resetSettings = e.target.closest('[data-action="reset-settings"]');
    if(resetSettings){
      state.settings = { ...(state.settings || {}), theme:'dark', colorPalette:'azul', fontFamily:'default', fontSize:'medium', textColor:'#e9eaf2', pageBg:{type:'default',value:''} };
      applySettings();
      persist(); closeModal(); render();
      return;
    }

    const restoreTrash = e.target.closest('[data-action="restore-trash"]');
    if(restoreTrash){
      const idx = parseInt(restoreTrash.dataset.idx, 10);
      const item = (state.trash || [])[idx];
      if(!item) return;
      if(item.type === 'category'){
        state.categories.push(item.category);
      } else if(item.type === 'subcategory'){
        let targetCat = state.categories.find(c => c.id === item.catId);
        if(!targetCat){
          targetCat = { id: uid(), name: 'Recuperados', color: '#7d8194', links: [] };
          state.categories.push(targetCat);
        }
        targetCat.subcategories = targetCat.subcategories || [];
        targetCat.subcategories.push(item.subcategory);
      } else if(item.type === 'link'){
        let targetCat = state.categories.find(c => c.id === item.catId);
        if(!targetCat){
          targetCat = state.categories.find(c => c.name === 'Recuperados');
          if(!targetCat){
            targetCat = { id: uid(), name: 'Recuperados', color: '#7d8194', links: [] };
            state.categories.push(targetCat);
          }
        }
        targetCat.links.push(item.link);
      }
      state.trash.splice(idx, 1);
      persist(); closeModal(); render();
      return;
    }

    const purgeTrashItem = e.target.closest('[data-action="purge-trash-item"]');
    if(purgeTrashItem){
      const idx = parseInt(purgeTrashItem.dataset.idx, 10);
      state.trash.splice(idx, 1);
      persist(); openTrashForm();
      return;
    }

    const emptyTrash = e.target.closest('[data-action="empty-trash"]');
    if(emptyTrash){
      state.trash = [];
      persist(); closeModal();
      return;
    }
  });

  // ---------- Drag & drop ----------
  let dragSource = null; // { type:'link', catId, linkId } | { type:'category', catId }

  function clearDragOverStyles(){
    document.querySelectorAll('.drag-over-top,.drag-over-bottom').forEach(el => {
      el.classList.remove('drag-over-top','drag-over-bottom');
    });
    document.querySelectorAll('.drag-over-empty').forEach(el => el.classList.remove('drag-over-empty'));
    document.querySelectorAll('.nav-drag-over-left,.nav-drag-over-right').forEach(el => {
      el.classList.remove('nav-drag-over-left','nav-drag-over-right');
    });
  }

  document.addEventListener('dragstart', e => {
    const catHandle = e.target.closest('.cat-drag-handle');
    if(catHandle){
      const card = catHandle.closest('.card');
      dragSource = { type: 'category', catId: card.dataset.catId };
      try{ e.dataTransfer.setData('text/plain', card.dataset.catId); }catch(err){}
      e.dataTransfer.effectAllowed = 'move';
      requestAnimationFrame(() => card.classList.add('dragging'));
      return;
    }
    const navPillHandle = e.target.closest('.cat-nav-pill');
    if(navPillHandle){
      dragSource = { type: 'category', catId: navPillHandle.dataset.catId };
      try{ e.dataTransfer.setData('text/plain', navPillHandle.dataset.catId); }catch(err){}
      e.dataTransfer.effectAllowed = 'move';
      requestAnimationFrame(() => navPillHandle.classList.add('dragging'));
      return;
    }
    const linkHandle = e.target.closest('.drag-handle');
    if(!linkHandle || linkHandle.getAttribute('draggable') !== 'true') return;
    const row = linkHandle.closest('.link-row');
    if(!row) return;
    dragSource = { type: 'link', catId: row.dataset.catId, subcatId: row.dataset.subcatId || '', linkId: row.dataset.linkId };
    try{ e.dataTransfer.setData('text/plain', row.dataset.linkId); }catch(err){}
    e.dataTransfer.effectAllowed = 'move';
    requestAnimationFrame(() => row.classList.add('dragging'));
  });

  document.addEventListener('dragend', () => {
    document.querySelectorAll('.link-row.dragging, .card.dragging, .cat-nav-pill.dragging').forEach(r => r.classList.remove('dragging'));
    clearDragOverStyles();
    dragSource = null;
  });

  document.addEventListener('dragover', e => {
    if(!dragSource) return;

    if(dragSource.type === 'category'){
      const pill = e.target.closest('.cat-nav-pill');
      if(pill){
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        clearDragOverStyles();
        if(pill.dataset.catId !== dragSource.catId){
          const rect = pill.getBoundingClientRect();
          const before = (e.clientX - rect.left) < rect.width / 2;
          pill.classList.add(before ? 'nav-drag-over-left' : 'nav-drag-over-right');
        }
        return;
      }
      const card = e.target.closest('.card');
      if(!card || card.classList.contains('add-category')) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      clearDragOverStyles();
      if(card.dataset.catId !== dragSource.catId){
        const rect = card.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height / 2;
        card.classList.add(before ? 'drag-over-top' : 'drag-over-bottom');
      }
      return;
    }

    const list = e.target.closest('.link-list');
    if(!list) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const row = e.target.closest('.link-row');
    clearDragOverStyles();
    if(row && row.dataset.linkId !== dragSource.linkId){
      const rect = row.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      row.classList.add(before ? 'drag-over-top' : 'drag-over-bottom');
    } else if(!row){
      list.classList.add('drag-over-empty');
    }
  });

  document.addEventListener('drop', e => {
    if(!dragSource) return;

    if(dragSource.type === 'category'){
      const pill = e.target.closest('.cat-nav-pill');
      if(pill){
        e.preventDefault();
        const targetCatId = pill.dataset.catId;
        if(targetCatId === dragSource.catId){ clearDragOverStyles(); dragSource = null; return; }
        const srcIndex = state.categories.findIndex(c => c.id === dragSource.catId);
        if(srcIndex === -1){ clearDragOverStyles(); dragSource = null; return; }
        const [moved] = state.categories.splice(srcIndex, 1);
        let targetIndex = state.categories.findIndex(c => c.id === targetCatId);
        if(targetIndex === -1) targetIndex = state.categories.length;
        const rect = pill.getBoundingClientRect();
        const before = (e.clientX - rect.left) < rect.width / 2;
        state.categories.splice(before ? targetIndex : targetIndex + 1, 0, moved);
        clearDragOverStyles();
        dragSource = null;
        persist();
        render();
        return;
      }
      const card = e.target.closest('.card');
      if(!card || card.classList.contains('add-category')) return;
      e.preventDefault();
      const targetCatId = card.dataset.catId;
      if(targetCatId === dragSource.catId){ clearDragOverStyles(); dragSource = null; return; }

      const srcIndex = state.categories.findIndex(c => c.id === dragSource.catId);
      if(srcIndex === -1){ clearDragOverStyles(); dragSource = null; return; }
      const [moved] = state.categories.splice(srcIndex, 1);

      let targetIndex = state.categories.findIndex(c => c.id === targetCatId);
      if(targetIndex === -1) targetIndex = state.categories.length;
      const rect = card.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      state.categories.splice(before ? targetIndex : targetIndex + 1, 0, moved);

      clearDragOverStyles();
      dragSource = null;
      persist();
      render();
      return;
    }

    const list = e.target.closest('.link-list');
    if(!list) return;
    e.preventDefault();

    const targetCatId = list.dataset.catId;
    const targetSubcatId = list.dataset.subcatId || '';
    const row = e.target.closest('.link-row');

    const srcCtx = findLinkContext(dragSource.catId, dragSource.subcatId, dragSource.linkId);
    if(!srcCtx){ clearDragOverStyles(); dragSource = null; return; }
    const srcIndex = srcCtx.arr.findIndex(l => l.id === dragSource.linkId);
    if(srcIndex === -1){ clearDragOverStyles(); dragSource = null; return; }
    const [moved] = srcCtx.arr.splice(srcIndex, 1);

    const targetCat = state.categories.find(c => c.id === targetCatId);
    const targetArr = targetSubcatId
      ? (targetCat.subcategories || []).find(s => s.id === targetSubcatId)?.links
      : targetCat.links;
    if(!targetArr){ srcCtx.arr.splice(srcIndex, 0, moved); dragSource = null; clearDragOverStyles(); return; }

    let targetIndex = targetArr.length;
    if(row){
      const rect = row.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      let idx = targetArr.findIndex(l => l.id === row.dataset.linkId);
      if(idx === -1) idx = targetArr.length;
      targetIndex = before ? idx : idx + 1;
    }
    targetArr.splice(targetIndex, 0, moved);

    clearDragOverStyles();
    dragSource = null;
    persist();
    render();
  });

  function setupBackToTop(){
    if(document.getElementById('backToTopBtn')) return;
    const btn = document.createElement('button');
    btn.id = 'backToTopBtn';
    btn.className = 'back-to-top';
    btn.title = 'Volver arriba';
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>';
    btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    document.body.appendChild(btn);
    window.addEventListener('scroll', () => {
      btn.classList.toggle('visible', window.scrollY > 400);
    }, { passive: true });
  }

  // ---------- Init ----------
  root.innerHTML = '<div class="empty">Cargando iPortal…</div>';
  loadState().then(() => { applySettings(); render(); setupBackToTop(); });
})();
</script>
